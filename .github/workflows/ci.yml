name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    # 本项目明确只验证 macOS / Linux 语义，不覆盖 Windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 代码卫生
        run: pnpm run hygiene
      - name: 测试
        run: pnpm test
      - name: 类型检查
        run: pnpm run typecheck
      - name: 构建插件产物
        run: pnpm run build:dsh
      - name: 打包内容校验
        run: pnpm run check:pack
      - name: 产物不得依赖宿主包
        run: |
          if grep -rE "from ['\"]@deepseek-ai" packages/dsh/lib --include='*.js'; then
            echo "::error::产物里出现了宿主包 import，会导致安装后无法加载"
            exit 1
          fi
